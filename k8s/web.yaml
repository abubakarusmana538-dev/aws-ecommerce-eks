apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-html
  namespace: ecommerce
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Usman Abubakar E-commerce Project</title>
      <style>
        body { margin:0; font-family: Arial, sans-serif; background:#f4f6f9; color:#1f2937; }
        header { background:#174a8b; color:#fff; padding:28px 40px; }
        header h1 { margin:0 0 6px; font-size:30px; }
        header p { margin:0; opacity:.85; }
        main { max-width:960px; margin:30px auto; padding:0 20px; }
        .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; }
        .card { background:#fff; border-radius:10px; padding:18px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
        .card h3 { margin:0 0 8px; }
        .price { color:#174a8b; font-weight:bold; }
        button { background:#174a8b; color:#fff; border:0; padding:9px 16px; border-radius:6px; cursor:pointer; margin-top:10px; }
        footer { text-align:center; padding:24px; color:#6b7280; font-size:14px; }
      </style>
    </head>
    <body>
      <header>
        <h1>Usman Abubakar E-commerce Project</h1>
        <p>Running on AWS: VPC &bull; EC2 &bull; EKS &bull; RDS &bull; S3</p>
      </header>
      <main>
        <h2>Featured products</h2>
        <div class="grid">
          <div class="card"><h3>Laptop</h3><div class="price">&pound;550</div><button>Add to cart</button></div>
          <div class="card"><h3>Mobile</h3><div class="price">&pound;250</div><button>Add to cart</button></div>
          <div class="card"><h3>Keyboard</h3><div class="price">&pound;15</div><button>Add to cart</button></div>
          <div class="card"><h3>Monitor</h3><div class="price">&pound;120</div><button>Add to cart</button></div>
        </div>
      </main>
      <footer>&copy; Usman Abubakar &mdash; E-commerce project on Kubernetes (Amazon EKS)</footer>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: html
          configMap:
            name: web-html
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: ecommerce
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
